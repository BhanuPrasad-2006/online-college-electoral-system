services:
  - type: web
    name: oces-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOLER_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 5
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false

  - type: web
    name: oces-frontend
    env: node
    buildCommand: npm run build
    startCommand: npm run start
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: ${oces-backend}/api/v1
      - key: VITE_API_ORIGIN
        value: ${oces-backend}
      - key: VITE_RECAPTCHA_SITE_KEY
        value: 6LfMDQEtAAAAADFEVY8Eg1BsgnMtxhW5JScO2h6I

