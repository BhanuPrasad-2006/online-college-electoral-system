services:
  - type: web
    name: oces-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOLER_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 5
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: ${oces-ai-service}
      - key: AI_SERVICE_API_KEY
        value: default-ai-service-key-change-in-prod
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: WARMUP_BIOMETRIC_MODEL
        value: "false"

  - type: web
    name: oces-ai-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: ai_service
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_API_KEY
        value: default-ai-service-key-change-in-prod
      - key: BACKEND_URL
        value: ${oces-backend}
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"

  - type: web
    name: oces-frontend
    env: node
    buildCommand: npm run build
    startCommand: npm run start
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: ${oces-backend}/api/v1
      - key: VITE_API_ORIGIN
        value: ${oces-backend}
      - key: VITE_RECAPTCHA_SITE_KEY
        value: 6LfMDQEtAAAAADFEVY8Eg1BsgnMtxhW5JScO2h6I



